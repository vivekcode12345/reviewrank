<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewRank</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo-row">
        <span class="logo-icon">📊</span>
        <h1>ReviewRank</h1>
      </div>
      <p class="tagline">Ranking products by customer review volume</p>
    </header>

    <main class="content">
      <!-- Initial state: budget inputs + analyze button -->
      <div id="initialState" class="initial-state">
        <div class="budget-section">
          <label class="budget-label">Budget Range (optional)</label>
          <div class="budget-inputs">
            <div class="budget-field">
              <span class="currency-symbol">₹</span>
              <input type="text" id="minPrice" placeholder="Min" autocomplete="off" inputmode="numeric">
            </div>
            <span class="budget-separator">—</span>
            <div class="budget-field">
              <span class="currency-symbol">₹</span>
              <input type="text" id="maxPrice" placeholder="Max" autocomplete="off" inputmode="numeric">
            </div>
          </div>
        </div>
        <button id="analyzeBtn" class="analyze-btn">
          <span class="btn-label">Analyze This Page</span>
          <span class="btn-spinner" style="display:none;">
            <span class="spinner"></span>
          </span>
        </button>
      </div>

      <!-- Error state -->
      <div id="errorState" class="error-state" style="display:none;">
        <span class="error-icon">⚠️</span>
        <p id="errorText" class="error-text"></p>
        <p id="errorHint" class="error-hint" style="display:none;"></p>
      </div>

      <!-- Results state -->
      <div id="resultsState" class="results-state" style="display:none;">
        <div class="results-header">
          <span class="results-count" id="resultsCount"></span>
          <span class="results-sub" id="resultsSub"></span>
        </div>
        <div id="productsList" class="products-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p>Review count is a popularity indicator and does not represent verified sales.</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
