<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewRank</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="logo-row">
        <img src="../icons/icons.png" alt="ReviewRank" class="logo-icon" width="34" height="34">
        <h1>ReviewRank</h1>
      </div>
      <p class="tagline">Ranking products by customer review volume</p>
    </header>

    <main class="content">
      <!-- Initial state: budget inputs + analyze button -->
      <div id="initialState" class="initial-state">
        <div class="budget-section">
          <label class="budget-label">Budget Range (optional)</label>
          <div class="budget-inputs">
            <div class="budget-field">
              <span class="currency-symbol" aria-hidden="true">₹</span>
              <input type="text" id="minPrice" placeholder="Min" autocomplete="off" inputmode="numeric" aria-label="Minimum price in rupees">
            </div>
            <span class="budget-separator" aria-hidden="true">—</span>
            <div class="budget-field">
              <span class="currency-symbol" aria-hidden="true">₹</span>
              <input type="text" id="maxPrice" placeholder="Max" autocomplete="off" inputmode="numeric" aria-label="Maximum price in rupees">
            </div>
          </div>
        </div>
        <button id="analyzeBtn" class="analyze-btn" aria-busy="false">
          <span class="btn-spinner" style="display:none;" aria-hidden="true">
            <span class="spinner"></span>
          </span>
          <span class="btn-label" id="btnLabel">Analyze This Page</span>
        </button>
        <p id="loadingStatus" class="loading-status" role="status" aria-live="polite" style="display:none;"></p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="error-state" style="display:none;" role="alert">
        <span class="error-icon" aria-hidden="true">⚠️</span>
        <p id="errorText" class="error-text"></p>
        <p id="errorHint" class="error-hint" style="display:none;"></p>
      </div>

      <!-- Results state -->
      <div id="resultsState" class="results-state" style="display:none;">
        <div class="results-header">
          <h2 class="results-count" id="resultsCount" aria-live="polite"></h2>
          <span class="results-sub" id="resultsSub"></span>
          <p class="results-note" id="resultsNote"></p>
        </div>
        <div class="results-actions">
          <button id="changeBudgetBtn" class="change-budget-btn">Change Budget</button>
        </div>
        <div id="priceInsights" class="price-insights" aria-live="polite"></div>
                <div id="productsList" class="products-list"></div>

        <!-- Display pagination: view results in groups of 4 -->
        <div id="uiPagination" class="ui-pagination-section" style="display:none;">
          <div class="ui-pagination-row">
            <button id="uiPrevBtn" class="ui-pagination-btn" aria-busy="false">Previous</button>
            <span id="uiPageNumbers" class="ui-page-numbers" aria-label="Page numbers"></span>
            <button id="uiPageBtn" class="ui-pagination-btn" aria-busy="false">Next</button>
          </div>
          <span id="uiPageLabel" class="ui-pagination-label" aria-live="polite"></span>
        </div>
        <div id="paginationSection" class="pagination-section" style="display:none;">
          <button id="paginationBtn" class="analyze-next-btn" aria-busy="false">Analyze Next Page</button>
          <p id="paginationMsg" class="pagination-message" role="status" aria-live="polite"></p>
        </div>

      </div>
    </main>

    <footer class="footer">
      <p>Rating volume is a popularity indicator and does not represent verified sales.</p>
    </footer>
  </div>

  <script src="../lib/display.js"></script>
  <script src="../lib/product-validation.js"></script>
  <script src="../lib/category-relevance.js"></script>
  <script src="../lib/site-adapters.js"></script>
  <script src="../lib/price-insights.js"></script>
  <script src="../lib/pagination.js"></script>
  <script src="../background/background.js"></script>
  <script src="../content/content.js"></script>
  <script src="popup.js"></script>
</body>
</html>
